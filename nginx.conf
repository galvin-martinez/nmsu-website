server {
    listen 80;
    server_name nmsu.galvin.pro;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers/error pages.
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Refuse anything dotfile-like (.git, .env, .gitlab-ci.yml, etc.) in case
    # it ever ends up in the image — none of this repo's dotfiles are copied
    # in by the Dockerfile, but this is a cheap belt-and-suspenders rule.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Basic security headers — harmless for a static portfolio site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
