server {
    listen 80;
    server_name nmsu.galvin.pro;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers/error pages.
    server_tokens off;

    # Emit relative Location headers. TLS terminates at Pangolin, so nginx
    # only ever sees http:// and would otherwise redirect users to an
    # absolute http:// URL, downgrading them for a hop before HSTS/Pangolin
    # bounced them back to https.
    absolute_redirect off;

    # ---- Compression ----------------------------------------------------
    # gzip defaults to text/html ONLY, so css/js/svg were crossing the wire
    # uncompressed. Pangolin compresses the HTML for us but not these, and the
    # stylesheet is render-blocking, so this lands directly on First
    # Contentful Paint. text/html is always included when gzip is on and
    # must NOT be listed in gzip_types (nginx errors on the duplicate).
    # Already-compressed formats (jpg/png/ico/woff2) are deliberately absent:
    # re-compressing them costs CPU and usually grows the file.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/calendar
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ---- Security headers ----------------------------------------------
    # NOTE: nginx does NOT inherit add_header into a location that declares
    # its own add_header. Any location below that sets a header must repeat
    # this whole block, or it silently serves responses with no headers at
    # all. That is why the /assets/ block re-declares them.
    #
    # The CSP is strict because the site is fully self-hosted: no third-party
    # scripts, styles, fonts or frames, and no inline event handlers. The one
    # inline <script> is the theme controller, allowed by its sha256 hash.
    #
    # !! If you edit that inline <script>, regenerate the hash or the theme
    #    toggle will silently stop working. From public/:
    #      python3 -c "import re,hashlib,base64,pathlib; \
    #        b=re.search(r'<script>(.*?)</script>', pathlib.Path('index.html').read_text(), re.S).group(1); \
    #        print('sha256-'+base64.b64encode(hashlib.sha256(b.encode()).digest()).decode())"
    set $csp "default-src 'self'; script-src 'self' 'sha256-kt1Fmm9//Ync9p30vKV8Q63bWTn/H+qZlwiK1YD3JAc='; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HSTS. Set here rather than at Pangolin because Pangolin's Custom Headers
    # apply to the request sent upstream, not the response returned to the
    # browser — the header never reached clients from there. Pangolin passes
    # our response headers through, so setting it at the origin works.
    #
    # Browsers ignore HSTS on plain-HTTP responses, so emitting it
    # unconditionally is safe even though TLS terminates upstream.
    # Deliberately WITHOUT includeSubDomains (would break any HTTP-only
    # *.galvin.pro host) and WITHOUT preload. Raise to 31536000 once happy.
    add_header Strict-Transport-Security "max-age=86400" always;

    # For anyone who reads response headers. Not set inside location /assets/,
    # so it rides along with pages rather than every stylesheet and image.
    add_header X-Powered-By "Hatch Green Chile" always;

    # One canonical URL for the homepage. Anyone arriving at /index.html is
    # sent to / so the two never compete as duplicate pages (Lighthouse's
    # canonical audit fails on /index.html for exactly this reason).
    #
    # Matched on $request_uri, which is the ORIGINAL request line. Using
    # `location = /index.html` here instead would loop forever: `index
    # index.html` internally rewrites / to /index.html, and that internal
    # redirect re-runs location matching.
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the site's own 404 page for anything that doesn't resolve. The
    # =404 from try_files above lands here, and the response keeps its 404
    # status so crawlers/checkers still see a real "not found".
    error_page 404 /404.html;

    # `internal` keeps /404.html from being served as a normal 200 page.
    # Visiting it directly still renders it, just with a 404 status.
    location = /404.html {
        internal;
    }

    # nginx's bundled mime.types has no mapping for .ics, so it would fall back
    # to application/octet-stream. Do NOT "fix" this with a types { } block
    # here: that REPLACES the entire inherited MIME map rather than extending
    # it, which would break css/js/images. Set it for this one file instead.
    # This location declares no add_header, so it still inherits the security
    # headers from the server block above.
    location = /assets/next-vacation.ics {
        default_type text/calendar;
    }

    # Same story as the .ics above: no .webmanifest in nginx's mime.types, so
    # it was served as application/octet-stream. The correct type also lets it
    # match gzip_types.
    location = /assets/favicon/site.webmanifest {
        default_type application/manifest+json;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        # Repeated deliberately — see the note above; without these, every
        # asset response would ship with no security headers at all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # Refuse anything dotfile-like (.git, .env, .DS_Store, etc.) in case it
    # ever ends up in the image. public/.DS_Store is excluded at build time by
    # .dockerignore too, so this is the second layer rather than the only one.
    location ~ /\. {
        deny all;
        return 404;
    }
}
