server {
    listen 80;
    server_name nmsu.galvin.pro;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers/error pages.
    server_tokens off;

    # ---- Security headers ----------------------------------------------
    # NOTE: nginx does NOT inherit add_header into a location that declares
    # its own add_header. Any location below that sets a header must repeat
    # this whole block, or it silently serves responses with no headers at
    # all. That is why the /assets/ block re-declares them.
    #
    # The CSP is strict because the site is fully self-hosted: no third-party
    # scripts, styles, fonts or frames, and no inline event handlers. The one
    # inline <script> is the theme controller, allowed by its sha256 hash.
    #
    # !! If you edit that inline <script>, regenerate the hash or the theme
    #    toggle will silently stop working. From public/:
    #      python3 -c "import re,hashlib,base64,pathlib; \
    #        b=re.search(r'<script>(.*?)</script>', pathlib.Path('index.html').read_text(), re.S).group(1); \
    #        print('sha256-'+base64.b64encode(hashlib.sha256(b.encode()).digest()).decode())"
    set $csp "default-src 'self'; script-src 'self' 'sha256-kt1Fmm9//Ync9p30vKV8Q63bWTn/H+qZlwiK1YD3JAc='; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the site's own 404 page for anything that doesn't resolve. The
    # =404 from try_files above lands here, and the response keeps its 404
    # status so crawlers/checkers still see a real "not found".
    error_page 404 /404.html;

    # `internal` keeps /404.html from being served as a normal 200 page.
    # Visiting it directly still renders it, just with a 404 status.
    location = /404.html {
        internal;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        # Repeated deliberately — see the note above; without these, every
        # asset response would ship with no security headers at all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Refuse anything dotfile-like (.git, .env, .DS_Store, etc.) in case it
    # ever ends up in the image. public/.DS_Store is excluded at build time by
    # .dockerignore too, so this is the second layer rather than the only one.
    location ~ /\. {
        deny all;
        return 404;
    }
}
