server {
    listen 80;
    server_name nmsu.galvin.pro;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers/error pages.
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the site's own 404 page for anything that doesn't resolve. The
    # =404 from try_files above lands here, and the response keeps its 404
    # status so crawlers/checkers still see a real "not found".
    error_page 404 /404.html;

    # `internal` keeps /404.html from being served as a normal 200 page.
    # Visiting it directly still renders it, just with a 404 status.
    location = /404.html {
        internal;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Refuse anything dotfile-like (.git, .env, .gitlab-ci.yml, etc.) in case
    # it ever ends up in the image — none of this repo's dotfiles are copied
    # in by the Dockerfile, but this is a cheap belt-and-suspenders rule.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Basic security headers — harmless for a static portfolio site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
