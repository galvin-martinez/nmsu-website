<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1096" role="img" aria-labelledby="dp-t dp-d" font-family="Inter, Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="dp-t">How this site gets from a git push to your browser</title>
  <desc id="dp-d">A deployment diagram. On my machine, a git push. Self hosted at home, GitLab takes the
    commit, Komodo sees the webhook and redeploys, Docker runs nginx on Alpine, and newt dials out. The
    connection crosses the internet through an encrypted outbound tunnel. On a VPS, Pangolin holds the
    public address and terminates TLS, then serves your browser over HTTPS. No inbound ports are
    forwarded at home.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#3d4a6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="780" height="1096" fill="#0b1120"/>
  <rect width="780" height="1096" fill="url(#dots)"/>
  <rect x="110" y="56" width="64" height="3" rx="1.5" fill="url(#fade)"/>
  <text x="110" y="46" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#64748b" letter-spacing="2.6">DEPLOYMENT PATH</text>
  <text x="110" y="94" font-size="25" font-weight="700" fill="#f1f5f9">From a git push to your browser</text>
  <text x="110" y="118" font-size="13" fill="#7c8aa8">Nothing here listens on a port I opened.</text>

  <text x="110" y="150" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#5d6b8a" letter-spacing="2.2">YOUR MACHINE</text>
  <g><rect x="110" y="166" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="166" width="3.5" height="74" rx="1.8" fill="#a78bfa"/><circle cx="156" cy="203" r="21" fill="#a78bfa" fill-opacity="0.10"/><g stroke="#a78bfa" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="145" y="194" width="22" height="18" rx="3.5"/><path d="M150 200 l4 3.5 -4 3.5 M157 207 h5"/></g><text x="192" y="199" font-size="16.5" font-weight="600" fill="#e8edf7">git push</text><text x="192" y="219" font-size="12.5" fill="#8b98b4">One command. That is the whole deploy.</text></g>
  <path d="M390 240 V267" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="110" y="274" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#5d6b8a" letter-spacing="2.2">SELF-HOSTED, AT HOME</text>
  <g><rect x="110" y="290" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="290" width="3.5" height="74" rx="1.8" fill="#22d3ee"/><circle cx="156" cy="327" r="21" fill="#22d3ee" fill-opacity="0.10"/><g stroke="#22d3ee" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="149" cy="320" r="3"/><circle cx="149" cy="335" r="3"/><circle cx="164" cy="326" r="3"/><path d="M149 323 v9 M149 329 q0 -8 12 -8"/></g><text x="192" y="323" font-size="16.5" font-weight="600" fill="#e8edf7">GitLab</text><text x="192" y="343" font-size="12.5" fill="#8b98b4">Takes the commit</text></g>
  <path d="M390 364 V383" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="381" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">fires a webhook</text>
  <g><rect x="110" y="390" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="390" width="3.5" height="74" rx="1.8" fill="#22d3ee"/><circle cx="156" cy="427" r="21" fill="#22d3ee" fill-opacity="0.10"/><g stroke="#22d3ee" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M165 425 a10 10 0 1 0 -3 7"/><path d="M165 418 v7 h-7"/></g><text x="192" y="423" font-size="16.5" font-weight="600" fill="#e8edf7">Komodo</text><text x="192" y="443" font-size="12.5" fill="#8b98b4">Sees the hook, redeploys</text></g>
  <path d="M390 464 V483" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="481" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">builds an image</text>
  <g><rect x="110" y="490" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="490" width="3.5" height="74" rx="1.8" fill="#22d3ee"/><circle cx="156" cy="527" r="21" fill="#22d3ee" fill-opacity="0.10"/><g stroke="#22d3ee" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M156 517 l10 5.5 v11 L156 539 l-10 -5.5 v-11 z"/><path d="M146 523 l10 5.5 10 -5.5 M156 528 v11"/></g><text x="192" y="523" font-size="16.5" font-weight="600" fill="#e8edf7">Docker, nginx on Alpine</text><text x="192" y="543" font-size="12.5" fill="#8b98b4">Serves plain static files</text></g>
  <path d="M390 564 V583" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="581" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">runs on the LAN</text>
  <g><rect x="110" y="590" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="590" width="3.5" height="74" rx="1.8" fill="#22d3ee"/><circle cx="156" cy="627" r="21" fill="#22d3ee" fill-opacity="0.10"/><g stroke="#22d3ee" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M146 631 v5 a2 2 0 0 0 2 2 h16 a2 2 0 0 0 2 -2 v-5"/><path d="M156 633 v-15 M151 621 l5 -5 5 5"/></g><text x="192" y="623" font-size="16.5" font-weight="600" fill="#e8edf7">newt</text><text x="192" y="643" font-size="12.5" fill="#8b98b4">Dials out. Nothing dials in.</text></g>
  <path d="M390 664 V689" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="684" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">outbound only</text>
  <ellipse cx="390" cy="752" rx="205" ry="64" fill="#60a5fa" fill-opacity="0.07"/>
  <g transform="translate(246,698)"><path d="M30 78 a24 24 0 0 1 3 -47 a30 30 0 0 1 57 -10 a25 25 0 0 1 25 27 a21 21 0 0 1 -7 30 z" fill="#1b2742" stroke="#60a5fa" stroke-width="1.8"/></g>
  <text x="424" y="746" font-size="16" font-weight="600" fill="#bfd6ff">The internet</text>
  <text x="424" y="766" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c94bd">encrypted tunnel</text>
  <path d="M390 808 V827" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="110" y="834" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#5d6b8a" letter-spacing="2.2">ON A VPS</text>
  <g><rect x="110" y="850" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="850" width="3.5" height="74" rx="1.8" fill="#fbbf24"/><circle cx="156" cy="887" r="21" fill="#fbbf24" fill-opacity="0.10"/><g stroke="#fbbf24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M156 876 l10 4 v7 c0 6 -4 10 -10 12 -6 -2 -10 -6 -10 -12 v-7 z"/><path d="M152 887 l3 3 5.5 -6"/></g><text x="192" y="883" font-size="16.5" font-weight="600" fill="#e8edf7">Pangolin</text><text x="192" y="903" font-size="12.5" fill="#8b98b4">Public address. TLS terminates here.</text></g>
  <path d="M390 924 V943" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="941" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">https</text>
  <g><rect x="110" y="950" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="950" width="3.5" height="74" rx="1.8" fill="#34d399"/><circle cx="156" cy="987" r="21" fill="#34d399" fill-opacity="0.10"/><g stroke="#34d399" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="145" y="978" width="22" height="18" rx="3"/><path d="M145 984 h22"/><circle cx="149" cy="981" r="0.9" fill="#34d399"/><circle cx="153" cy="981" r="0.9" fill="#34d399"/></g><text x="192" y="983" font-size="16.5" font-weight="600" fill="#e8edf7">Your browser</text><text x="192" y="1003" font-size="12.5" fill="#8b98b4">This page, however you got here.</text></g>

  <rect x="110" y="1046" width="560" height="0.8" fill="#27324d"/>
  <text x="110" y="1072" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5d6b8a">inbound_ports_forwarded_at_home = 0</text>
</svg>
