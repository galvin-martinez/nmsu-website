<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1086" role="img" aria-labelledby="dp-t dp-d" font-family="Inter, Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="dp-t">How this site gets from a git push to your browser</title>
  <desc id="dp-d">A deployment diagram. On my MacBook, I write plain HTML and CSS in VS Code, then git push.
    Self hosted at home as Docker containers, GitLab takes the commit, Komodo sees the webhook and
    redeploys, nginx serves the files, and newt dials out. The connection crosses the internet through an
    encrypted outbound tunnel. On a VPS, Pangolin holds the public address and terminates TLS, then serves
    your browser over HTTPS. No inbound ports are forwarded at home.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L8 5 L0 9" fill="none" stroke="#3d4a6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="187" cy="0" r="897" gradientTransform="scale(1,1.377)">
      <stop offset="0%" stop-color="#1b2550"/>
      <stop offset="45%" stop-color="#101833"/>
      <stop offset="100%" stop-color="#080b17"/>
    </radialGradient>
  </defs>

  <rect x="-1500" y="-1500" width="3780" height="4074" fill="url(#bg)"/>
  <rect x="-1500" y="-1500" width="3780" height="4074" fill="url(#dots)"/>
  <rect x="110" y="56" width="64" height="3" rx="1.5" fill="url(#fade)"/>
  <text x="110" y="46" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#64748b" letter-spacing="2.6">DEPLOYMENT PATH</text>
  <text x="110" y="94" font-size="25" font-weight="700" fill="#f1f5f9">From a git push to your browser</text>
  <text x="110" y="118" font-size="13" fill="#7c8aa8">Nothing here listens on a port I opened.</text>

  <text x="110" y="150" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#5d6b8a" letter-spacing="2.2">GALVIN'S MACBOOK</text>
  <g><rect x="110" y="166" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="166" width="3.5" height="74" rx="1.8" fill="#a78bfa"/><circle cx="156" cy="203" r="21" fill="#a78bfa" fill-opacity="0.10"/><g stroke="#a78bfa" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M152 197 l-7 6 l7 6"/><path d="M160 197 l7 6 l-7 6"/><path d="M158 194 l-4 18"/></g><text x="192" y="199" font-size="16.5" font-weight="600" fill="#e8edf7">VS Code</text><text x="192" y="219" font-size="12.5" fill="#8b98b4">Plain HTML and CSS.</text></g>
  <path d="M390 240 V273" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="254" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">git push</text>
  <text x="110" y="264" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#5d6b8a" letter-spacing="2.2">SELF-HOSTED AT HOME, IN DOCKER</text>
  <g><rect x="110" y="280" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="280" width="3.5" height="74" rx="1.8" fill="#22d3ee"/><circle cx="156" cy="317" r="21" fill="#22d3ee" fill-opacity="0.10"/><g stroke="#22d3ee" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="149" cy="310" r="3"/><circle cx="149" cy="325" r="3"/><circle cx="164" cy="316" r="3"/><path d="M149 313 v9 M149 319 q0 -8 12 -8"/></g><text x="192" y="313" font-size="16.5" font-weight="600" fill="#e8edf7">GitLab</text><text x="192" y="333" font-size="12.5" fill="#8b98b4">Takes the commit</text></g>
  <path d="M390 354 V387" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="368" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">fires a webhook</text>
  <g><rect x="110" y="394" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="394" width="3.5" height="74" rx="1.8" fill="#22d3ee"/><circle cx="156" cy="431" r="21" fill="#22d3ee" fill-opacity="0.10"/><g stroke="#22d3ee" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M165 429 a10 10 0 1 0 -3 7"/><path d="M165 422 v7 h-7"/></g><text x="192" y="427" font-size="16.5" font-weight="600" fill="#e8edf7">Komodo</text><text x="192" y="447" font-size="12.5" fill="#8b98b4">Sees the hook, redeploys</text></g>
  <path d="M390 468 V501" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="482" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">builds an image</text>
  <g><rect x="110" y="508" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="508" width="3.5" height="74" rx="1.8" fill="#22d3ee"/><circle cx="156" cy="545" r="21" fill="#22d3ee" fill-opacity="0.10"/><g stroke="#22d3ee" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M156 535 l10 5.5 v11 L156 557 l-10 -5.5 v-11 z"/><path d="M146 541 l10 5.5 10 -5.5 M156 546 v11"/></g><text x="192" y="541" font-size="16.5" font-weight="600" fill="#e8edf7">nginx</text><text x="192" y="561" font-size="12.5" fill="#8b98b4">Serves plain static files</text></g>
  <path d="M390 582 V615" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="596" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">runs on the LAN</text>
  <g><rect x="110" y="622" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="622" width="3.5" height="74" rx="1.8" fill="#22d3ee"/><circle cx="156" cy="659" r="21" fill="#22d3ee" fill-opacity="0.10"/><g stroke="#22d3ee" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M146 663 v5 a2 2 0 0 0 2 2 h16 a2 2 0 0 0 2 -2 v-5"/><path d="M156 665 v-15 M151 653 l5 -5 5 5"/></g><text x="192" y="655" font-size="16.5" font-weight="600" fill="#e8edf7">newt</text><text x="192" y="675" font-size="12.5" fill="#8b98b4">Dials out. Nothing dials in.</text></g>
  <path d="M390 696 V722" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="710" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">outbound only</text>
  <g transform="translate(218,730)"><path d="M30 78 a24 24 0 0 1 3 -47 a30 30 0 0 1 57 -10 a25 25 0 0 1 25 27 a21 21 0 0 1 -7 30 z" fill="#1b2742" stroke="#60a5fa" stroke-width="1.8"/></g>
  <text x="398" y="778" font-size="16" font-weight="600" fill="#bfd6ff">The internet</text>
  <text x="398" y="798" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c94bd">encrypted tunnel</text>
  <path d="M390 840 V875" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="110" y="866" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#5d6b8a" letter-spacing="2.2">ON A VPS</text>
  <g><rect x="110" y="882" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="882" width="3.5" height="74" rx="1.8" fill="#fbbf24"/><circle cx="156" cy="919" r="21" fill="#fbbf24" fill-opacity="0.10"/><g stroke="#fbbf24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M156 908 l10 4 v7 c0 6 -4 10 -10 12 -6 -2 -10 -6 -10 -12 v-7 z"/><path d="M152 919 l3 3 5.5 -6"/></g><text x="192" y="915" font-size="16.5" font-weight="600" fill="#e8edf7">Pangolin</text><text x="192" y="935" font-size="12.5" fill="#8b98b4">Public address. TLS terminates here.</text></g>
  <path d="M390 956 V989" stroke="#3d4a6b" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="970" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8aa8" letter-spacing="0.4">https</text>
  <text x="110" y="980" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" fill="#5d6b8a" letter-spacing="2.2">ON YOUR DEVICE</text>
  <g><rect x="110" y="996" width="560" height="74" rx="13" fill="#141d33" stroke="#27324d"/><rect x="110" y="996" width="3.5" height="74" rx="1.8" fill="#34d399"/><circle cx="156" cy="1033" r="21" fill="#34d399" fill-opacity="0.10"/><g stroke="#34d399" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="145" y="1024" width="22" height="18" rx="3"/><path d="M145 1030 h22"/><circle cx="149" cy="1027" r="0.9" fill="#34d399"/><circle cx="153" cy="1027" r="0.9" fill="#34d399"/></g><text x="192" y="1029" font-size="16.5" font-weight="600" fill="#e8edf7">Your browser</text><text x="192" y="1049" font-size="12.5" fill="#8b98b4">This page, however you got here.</text></g>
</svg>
